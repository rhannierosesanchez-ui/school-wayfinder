<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SJCNI | Campus Wayfinder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="intro-overlay">
    <div class="intro-box">
        <img src="logo-clear.png" alt="SJCNI" class="intro-logo">
        <h2>Welcome to SJCNI</h2>
        <p>Your Campus Wayfinder is ready...</p>
        <div class="loader"></div>
    </div>
</div>
<!-- NAVBAR -->
<header class="top-nav">
    <div class="logo-area">
        <img src="logo.png" alt="SJCNI Logo">
        <span class="brand-name">St. Joseph College of Novaliches, Inc.</span>
    </div>
    <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#">About</a>
    </nav>
</header>

<!-- HERO -->
<section class="hero">
    <div class="hero-overlay">
        <div class="hero-content">
            <h1>Interactive Campus Wayfinder</h1>
            <p>Find your destination inside the SJCNI campus</p>

            <div class="search-box">
                <input type="text" id="roomInput" placeholder="Search a room...">
                <button onclick="handleSearch()">Search</button>
            </div>
        </div>
    </div>
</section>

<!-- MAIN CONTENT -->
<section class="wayfinder-wrapper">

    <!-- MAP + Floors -->
    <div class="map-section">
        <div class="floor-pills">
            <button class="f-btn active" onclick="setFloor('floor1.jpg', this)">LEVEL 1</button>
            <button class="f-btn" onclick="setFloor('floor2.jpg', this)">LEVEL 2</button>
            <button class="f-btn" onclick="setFloor('floor3.jpg', this)">LEVEL 3</button>
        </div>
        <div class="map-container">
    <img src="floor1.jpg" id="activeMap">

    <!-- PATH LINE -->
    <img id="pathLine" class="path-line" src="" alt="path">

    <!-- RED PIN -->
    <div id="pin" class="map-marker"></div>
</div>

    </div>

    <!-- STREETVIEW FLOATING -->
    <div id="streetview-floating">
        <iframe id="tour-embeded" 
            src="https://tour.panoee.net/iframe/696b30cbd66679444968af3c" 
            frameborder="0" 
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            scrolling="no">
        </iframe>
    </div>

</section>

<script src="script.js"></script>
</body>
</html>
