<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Wayfinder</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="logo">CAMPUS<span>WAYFINDER</span></div>
        <nav>
            <div class="status-dot"></div> Live Map
        </nav>
    </header>

    <main class="container">
        <section class="hero-overlay-section">
            <div class="hero-content">
                <h1>Where are you headed?</h1>
                <div class="search-container">
                    <input type="text" placeholder="Search buildings, rooms, or offices...">
                    <button>Search</button>
                </div>
            </div>
        </section>

        <div class="bento-grid">
            <div class="tile tile-red wide">
                <h3>Quickest Route</h3>
                <p>Find the fastest way to your next class.</p>
                <span class="arrow">→</span>
            </div>
            
            <div class="tile tile-white">
                <div class="icon">📍</div>
                <h4>Buildings</h4>
            </div>

            <div class="tile tile-white">
                <div class="icon">🍴</div>
                <h4>Dining</h4>
            </div>

            <div class="tile tile-white">
                <div class="icon">📚</div>
                <h4>Library</h4>
            </div>

            <div class="tile tile-white">
                <div class="icon">🏋️‍♂️</div>
                <h4>Gymnasium</h4>
            </div>
        </div>
    </main>

</body>
</html>
