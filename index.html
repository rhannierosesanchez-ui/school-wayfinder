<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SJCNI Campus Wayfinder | Interactive Map</title>
    <meta name="description" content="Official interactive campus wayfinder for SJCNI. Find classrooms, labs, and offices with our 360° streetview and navigation map.">
    <meta name="keywords" content="SJCNI, Wayfinder, Campus Map, St. Joseph College of Novaliches Inc, School Navigation, SJCNI Streetview">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="intro-overlay">
    <div class="intro-box">
        <img src="logo-clear.png" alt="SJCNI" class="intro-logo">
        <h2>Welcome to SJCNI</h2>
        <p>Your Campus Wayfinder is ready...</p>
        <div class="loader"></div>
    </div>
</div>
<!-- NAVBAR -->
<header class="top-nav">
    <div class="logo-area">
        <img src="logo.png" alt="SJCNI Logo">
        <span class="brand-name">St. Joseph College of Novaliches, Inc.</span>
    </div>
    <nav class="nav-links">
    </nav>
</header>

<!-- HERO -->
<section class="hero">
    <div class="hero-overlay">
        <div class="hero-content">
            <h1>Interactive Campus Wayfinder</h1>
            <p>Find your destination inside the SJCNI campus</p>

            <div class="search-box">
                <input type="text" id="searchInput" list="roomOptions" placeholder="Search for a room...">
                <button onclick="handleSearch()">Search</button>
            </div>
        </div>
    </div>
</section>

<!-- MAIN CONTENT -->
<section class="wayfinder-wrapper">
        <div class="map-section">
            <div class="floor-pills">
                <button class="f-btn active" onclick="setFloor('floor1.jpg', this)">LEVEL 1</button>
                <button class="f-btn" onclick="setFloor('floor2.jpg', this)">LEVEL 2</button>
                <button class="f-btn" onclick="setFloor('floor3.jpg', this)">LEVEL 3</button>
            </div>
            <div class="map-container">
                <img src="floor1.jpg" id="activeMap">
                <img id="pathLine" class="path-line" src="" alt="path">
                <div id="pin" class="map-marker"></div>
            </div>
        </div>
    </section> <div id="streetview-floating">
        <iframe id="tour-embeded" src="https://tour.panoee.net/iframe/696b30cbd66679444968af3c" frameborder="0" allowfullscreen="true"></iframe>
    </div>

    <footer class="site-footer">
        <p>&copy; 2025-2026 Innoventures | Capstone Research Project. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <datalist id="roomOptions">
    <option value="Registrar">
    <option value="Cashier">
    <option value="Perseverance">
    <option value="Integrity">
    <option value="Certitude">
    <option value="Taekwondo">
    <option value="Peace">
    <option value="Dignity">
    <option value="Loyalty">
    <option value="Obedience">
    <option value="Restroom 1">
    <option value="Humility">
    <option value="Honesty">
    <option value="Prudence">
    <option value="Competence">
    <option value="Patience">
    <option value="Discernment">
    <option value="Courage">
    <option value="Wisdom">
    <option value="Faculty">
    <option value="Guidance">
    <option value="Clinic">
    <option value="Restroom 2">
    <option value="Sound">
    <option value="TLE">
    <option value="Gratitude">
    <option value="Unity">
    <option value="Grace">
    <option value="Tranquility">
    <option value="Righteousness">
    <option value="Fortitude">
    <option value="Excellence">
    <option value="Justice">
    <option value="Frugality">
    <option value="Industry">
    <option value="Restroom 3">
</datalist>
</body>
